name = "reiseplaner"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Nicht geheim: nur zur CORS-Prüfung, welche Origins den Proxy aufrufen dürfen.
# Mehrere Origins durch Komma trennen, z.B. für lokale Tests zusätzlich
# "http://127.0.0.1:8420,http://localhost:8420".
[vars]
ALLOWED_ORIGIN = "https://freiraummobil.github.io"

# OPENTRIPMAP_KEY wird NICHT hier eingetragen, sondern als Secret gesetzt:
#   npx wrangler secret put OPENTRIPMAP_KEY
# oder im Cloudflare-Dashboard unter Workers & Pages → dieser Worker →
# Settings → Variables and Secrets → Add → Type: Secret.
